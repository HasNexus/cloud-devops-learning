#Listing stages for the CI/CD pipeline
stages:
 - validate
 - plan
 - deploy
 - configure
 - cleanup


variables:
  PROJECT_NAME: "monitoring-grafana"
  TF_VAR_sub_id: $ARM_SUBSCRIPTION_ID

# Validate stage
validate-job:
  stage: validate
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never
  script:
    - cd Terraform/Azure/projects/monitoring-grafana
    - echo "Validating Terraform configuration..."
    - terraform init
      -backend-config="resource_group_name=$TF_BACKEND_RG"
      -backend-config="storage_account_name=$TF_BACKEND_SA"
      -backend-config="container_name=$TF_BACKEND_CONTAINER"
      -backend-config="key=monitoring.terraform.tfstate"
    - terraform validate


# Plan stage
plan-job:
  stage: plan
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  needs: [validate-job]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never
  script:
    - cd Terraform/Azure/projects/monitoring-grafana
    - echo "Planning Terraform deployment..."
    - terraform init
      -backend-config="resource_group_name=$TF_BACKEND_RG"
      -backend-config="storage_account_name=$TF_BACKEND_SA"
      -backend-config="container_name=$TF_BACKEND_CONTAINER"
      -backend-config="key=monitoring.terraform.tfstate"
    - terraform plan


# Deploy stage
deploy-job:
  stage: deploy
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  needs: [plan-job]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never
  script:
    - cd Terraform/Azure/projects/monitoring-grafana
    - echo "Applying Terraform deployment..."
    - terraform init
      -backend-config="resource_group_name=$TF_BACKEND_RG"
      -backend-config="storage_account_name=$TF_BACKEND_SA"
      -backend-config="container_name=$TF_BACKEND_CONTAINER"
      -backend-config="key=monitoring.terraform.tfstate"
    - terraform apply -auto-approve

  after_script:
    - |
      if [ "$CI_JOB_STATUS" == "failed" ]; then
        echo "Deployment failed for ${PROJECT_NAME}! Please check logs.";
        echo "Initiating cleanup of resources...";
        cd Terraform/Azure/projects/monitoring-grafana;
        terraform init \
          -backend-config="resource_group_name=$TF_BACKEND_RG" \
          -backend-config="storage_account_name=$TF_BACKEND_SA" \
          -backend-config="container_name=$TF_BACKEND_CONTAINER" \
          -backend-config="key=monitoring.terraform.tfstate";
        terraform destroy -auto-approve;
      fi
  # Save the generated Ansible inventory file for use in the configure stage
  artifacts:
    paths:
      - Terraform/Azure/projects/monitoring-grafana/inventory.yaml
    when: always


# Configure stage
configure-job:
  stage: configure
  image:
    name: cytopia/ansible:latest
    entrypoint: [""]
  needs: [deploy-job]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - Terraform/Azure/projects/monitoring-grafana/grafana-traffic.yaml
        - Terraform/Azure/projects/monitoring-grafana/traffic.sh
  script:
    - cd Terraform/Azure/projects/monitoring-grafana
    - echo "Configuring infrastructure with Ansible..."
    - ansible-playbook -i inventory.yaml grafana-traffic.yaml





